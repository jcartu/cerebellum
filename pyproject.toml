[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerebellum"
version = "0.1.0"
description = "Proactive ops assistant for RASPUTIN: event bus, successor-pattern mining, LLM-proposed actions, policy-gated execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Joshua Cartu" }]
keywords = ["agent", "ops", "memory", "rasputin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Monitoring",
]

dependencies = [
  "nats-py>=2.7,<3",
  "kuzu>=0.6,<0.8",
  "fastapi>=0.110,<0.120",
  "uvicorn[standard]>=0.27,<0.40",
  "openai>=1.40,<2",            # OpenRouter-compatible client
  "pyyaml>=6,<7",
  "httpx>=0.27,<0.30",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "pytest-httpx>=0.30,<1",
  "hypothesis>=6.100,<7",
]

[project.scripts]
cerebellum-observatory = "cerebellum.observatory_main:main"
cerebellum-arbiter     = "cerebellum.scripts.arbiter_loop:main"
cerebellum-cortex      = "cerebellum.scripts.generate_hypotheses:main"

[project.urls]
Repository = "https://github.com/jcartu/cerebellum"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/cerebellum"]

[tool.hatch.build.targets.sdist]
include = [
  "src/cerebellum",
  "policy.yaml",
  "config.example.json",
  "README.md",
  "SECURITY.md",
  "decisions.md",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["scripts/legacy", "src/cerebellum/migrations/_archive"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
  "S",    # bandit (security)
  "ASYNC",
]
ignore = [
  "E501",    # line length governed by formatter
  "S101",    # assert in tests is fine
  "B008",    # FastAPI Depends() in default args
  "B904",    # raise from err not needed for expected re-raises
  "S310",    # file permissions in tests
  "S324",    # cryptographic hash usage (intentional)
  "S603",    # subprocess call with shell=False is fine
  "ASYNC110", # asyncio.sleep in loops is intentional
  "RUF012",  # mutable class attrs are intentional
  "SIM108",  # if-else not always better than ternary
  "ASYNC240", # Path in async is fine for config loading
  "S311",     # random for jitter is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E402"]
"scripts/*" = ["E402"]  # path-fiddling at module top
"src/cerebellum/migrations/*" = ["S608"]  # SQL string composition is fine in migrations

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_decorators = true
no_implicit_reexport = true
show_error_codes = true
pretty = true

# Loosen for files still mid-rewrite. Tighten progressively per phase.
# Phase 6 exit gate: this section is empty.
[[tool.mypy.overrides]]
module = [
  "cerebellum.policy_arbiter",
  "cerebellum.episode_store",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

# Third-party libs without type stubs
[[tool.mypy.overrides]]
module = ["kuzu.*", "nats.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--cov=src/cerebellum",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml:coverage.xml",
  "--cov-fail-under=10",   # raised to 80 in Phase 6 exit gate
]
asyncio_mode = "auto"
markers = [
  "integration: requires running NATS / Kuzu / Qdrant",
  "slow: takes >5s",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::DeprecationWarning:nats.*",
  "ignore::DeprecationWarning:kuzu.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src/cerebellum"]
omit = [
  "src/cerebellum/migrations/*",
  "src/cerebellum/scripts/*",
  "src/cerebellum/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
